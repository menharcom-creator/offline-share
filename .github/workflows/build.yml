  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: src
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android project
        run: flutter create --platforms=android --org com.offlineshare --project-name offline_share .
      - name: Patch manifest (permissions, Android TV, minSdk 21)
        run: |
          pip install pillow
          python3 tools/patch_platforms.py android
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk OfflineShare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineShare-apk
          path: OfflineShare.apk

  ios:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: src
          path: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native iOS project
        run: flutter create --platforms=ios --org com.offlineshare --project-name offline_share .
      - name: Patch Info.plist
        run: python3 tools/patch_platforms.py ios
      - run: flutter pub get
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf Payload OfflineShare-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry OfflineShare-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineShare-unsigned-ipa
          path: OfflineShare-unsigned.ipa

